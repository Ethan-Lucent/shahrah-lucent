[package]
name = "lucent"
description = "A geo-distributed PostgreSQL proxy: routes every statement to the region that holds the data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "lucent"

[dependencies]
lucent-core.workspace = true
lucent-pool.workspace = true
lucent-proto.workspace = true
lucent-sql.workspace = true
sqlparser.workspace = true
lucent-txn.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
lucent-testkit.workspace = true
lucent-pool.workspace = true

[lints]
workspace = true
